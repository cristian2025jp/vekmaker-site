<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="中央穴を追加できる3Dプリント用コインやトークンを作成し、ブラウザからSTLファイルをダウンロードできます。">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://vekmaker.com/ja/coin-token-generator/">
    <link rel="alternate" hreflang="en" href="https://vekmaker.com/en/coin-token-generator/">
    <link rel="alternate" hreflang="pt" href="https://vekmaker.com/pt/coin-token-generator/">
    <link rel="alternate" hreflang="ja" href="https://vekmaker.com/ja/coin-token-generator/">
    <link rel="alternate" hreflang="x-default" href="https://vekmaker.com/en/coin-token-generator/">
    <link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
    <title>コイン・トークンSTLジェネレーター | VEKMaker</title>
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
/*
         * Prevents the Three.js canvas from increasing the width of the
         * right-hand grid column during ResizeObserver updates.
         */
        .generator-preview {
            min-width: 0;
        }

        #token-preview {
            width: 100%;
            height: 420px;
            min-width: 0;
            overflow: hidden;
            border-radius: 12px;
            background: #f8f9fa;
        }

        #token-preview canvas {
            display: block;
            max-width: 100%;
        }

        .language-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin: 0 0 18px;
            flex-wrap: wrap;
        }

        .language-switcher a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 999px;
            background: #ffffff;
            color: #374151;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .language-switcher a:hover {
            border-color: #93c5fd;
            color: #2563eb;
        }

        .language-switcher a[aria-current="page"] {
            border-color: #2563eb;
            background: #eff6ff;
            color: #1d4ed8;
        }

        @media (max-width: 700px) {
            #token-preview {
                height: 340px;
            }
        }
    </style>
</head>
<body>
    <div id="site-header"></div>
    <div id="site-menu"></div>

    <main class="container generator-page">
        <nav class="language-switcher" aria-label="言語選択">
            <a href="/en/coin-token-generator/" hreflang="en">EN</a>
            <a href="/pt/coin-token-generator/" hreflang="pt">PT</a>
            <a href="/ja/coin-token-generator/" hreflang="ja" aria-current="page">日本語</a>
        </nav>

        <section class="generator-intro">
            <h1>コイン・トークンSTLジェネレーター</h1>
            <p>中央穴を追加できるシンプルな3Dプリント用コインやトークンを作成し、STLファイルとして書き出せます。</p>
        </section>

        <section class="generator-layout">
            <div class="generator-panel">
                <h3>寸法</h3>

                <label>
                    直径（mm）
                    <input
                        type="number"
                        id="token-diameter"
                        value="40"
                        min="5"
                        max="300"
                        step="0.1"
                    >
                </label>

                <label>
                    厚さ（mm）
                    <input
                        type="number"
                        id="token-thickness"
                        value="3"
                        min="0.5"
                        max="100"
                        step="0.1"
                    >
                </label>

                <label>
                    分割数
                    <input
                        type="number"
                        id="token-segments"
                        value="96"
                        min="12"
                        max="256"
                        step="1"
                    >
                </label>

                <label class="checkbox-label">
                    <input
                        type="checkbox"
                        id="token-center-hole"
                        checked
                    >
                    中央穴
                </label>

                <label>
                    穴の直径（mm）
                    <input
                        type="number"
                        id="token-hole-diameter"
                        value="5"
                        min="1"
                        max="299"
                        step="0.1"
                    >
                </label>

                <p
                    id="token-validation-message"
                    class="validation-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button
                    id="generate-token"
                    class="button primary-button"
                >
                    トークンを生成
                </button>

                <button
                    id="download-token"
                    class="btn-primary"
                >
                    トークンSTLをダウンロード
                </button>
            </div>

            <div class="generator-preview">
                <h3>プレビュー</h3>
                <div
                    id="token-preview"
                    class="preview-area"
                ></div>
            </div>
        </section>
        <section class="faq">
            <h2>よくある質問</h2>
            <h3>中央穴なしのトークンを作成できますか？</h3>
            <p>はい。「中央穴」のチェックを外すと、穴のないコインまたはトークンを生成できます。</p>
            <h3>分割数を変更すると何が変わりますか？</h3>
            <p>分割数を増やすと円周が滑らかになりますが、STLファイルの形状データも複雑になります。</p>
            <h3>PLAで印刷できますか？</h3>
            <p>はい。生成されるモデルは一般的なPLA印刷に適しています。</p>
        </section>

    </main>

    <div id="site-footer"></div>

    <script>
        const PAGE = {
            title: "コイン・トークンジェネレーター",
            heading: "コイン・トークンSTLジェネレーター",
            canonical: "https://vekmaker.com/ja/coin-token-generator/",
            description: "中央穴を追加できる3Dプリント用コインやトークンを作成し、ブラウザからSTLファイルをダウンロードできます。",
            keywords: "STLジェネレーター, コインジェネレーター, トークンジェネレーター, 3Dプリント, STL作成",
            generator: "coin-token-generator"
        };
    </script>

    <script src="/assets/js/core/config.js"></script>
    <script src="/assets/js/core/layout.js"></script>
    <script src="/assets/js/core/page.js"></script>
    <script
        type="module"
        src="/assets/generators/coin-token/coin-token-generator.js"
    ></script>
</body>
</html>
