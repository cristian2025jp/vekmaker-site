<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create custom 3D printable washers and rings by setting the outer diameter, inner diameter and thickness, then download the STL file.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://vekmaker.com/ja/washer-ring-generator/">
    <link rel="alternate" hreflang="en" href="https://vekmaker.com/en/washer-ring-generator/">
    <link rel="alternate" hreflang="pt" href="https://vekmaker.com/pt/washer-ring-generator/">
    <link rel="alternate" hreflang="ja" href="https://vekmaker.com/ja/washer-ring-generator/">
    <link rel="alternate" hreflang="x-default" href="https://vekmaker.com/en/washer-ring-generator/">
    <link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
    <title>ワッシャー・リングSTLジェネレーター | VEKMaker</title>
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        /*
         * Prevents the Three.js canvas from increasing the width of the
         * preview column during ResizeObserver updates.
         */
        .generator-preview {
            min-width: 0;
        }

        #washer-preview {
            width: 100%;
            min-width: 0;
            overflow: hidden;
        }

        #washer-preview canvas {
            display: block;
            width: 100% !important;
            max-width: 100%;
        }

        .language-switcher{display:flex;justify-content:flex-end;gap:8px;margin:0 0 18px;flex-wrap:wrap}
        .language-switcher a{display:inline-flex;align-items:center;justify-content:center;min-width:48px;padding:6px 10px;border:1px solid #d1d5db;border-radius:999px;background:#fff;color:#374151;font-size:13px;font-weight:700;text-decoration:none}
        .language-switcher a:hover{border-color:#93c5fd;color:#2563eb}
        .language-switcher a[aria-current="page"]{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}
    </style>
</head>
<body>
    <div id="site-header"></div>
    <div id="site-menu"></div>

    <main class="container generator-page">
        <nav class="language-switcher" aria-label="言語選択">
            <a href="/en/washer-ring-generator/" hreflang="en">EN</a>
            <a href="/pt/washer-ring-generator/" hreflang="pt">PT</a>
            <a href="/ja/washer-ring-generator/" hreflang="ja" aria-current="page">日本語</a>
        </nav>

        <section class="generator-intro">
            <h1>ワッシャー・リングSTLジェネレーター</h1>
            <p>カスタムワッシャーや平たいリングを作成し、印刷用STLをダウンロードできます。</p>
        </section>

        <section class="generator-layout">
            <div class="generator-panel">
                <h2>寸法</h2>

                <label>
                    外径（mm）
                    <input
                        type="number"
                        id="washer-outer-diameter"
                        value="40"
                        min="3"
                        max="500"
                        step="0.1"
                    >
                </label>

                <label>
                    内径（mm）
                    <input
                        type="number"
                        id="washer-inner-diameter"
                        value="20"
                        min="0.5"
                        max="499"
                        step="0.1"
                    >
                </label>

                <label>
                    厚さ（mm）
                    <input
                        type="number"
                        id="washer-thickness"
                        value="3"
                        min="0.5"
                        max="100"
                        step="0.1"
                    >
                </label>

                <label>
                    分割数
                    <input
                        type="number"
                        id="washer-segments"
                        value="96"
                        min="12"
                        max="256"
                        step="1"
                    >
                </label>

                <p
                    id="washer-validation-message"
                    class="validation-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button
                    id="generate-washer"
                    class="button primary-button"
                    type="button"
                >
                    ワッシャーを生成
                </button>

                <button
                    id="download-washer"
                    class="btn-primary"
                    type="button"
                >
                    STLをダウンロード
                </button>
            </div>

            <div class="generator-preview">
                <h2>プレビュー</h2>
                <div id="washer-preview" class="preview-area"></div>
            </div>
        </section>

        <section class="faq">
            <h2>よくある質問</h2>

            <h3>リング幅とは何ですか？</h3>
            <p>
                リング幅は外径と内径の差の半分です。
                ジェネレーターは中央穴の周囲に十分な材料が残るか確認します。
            </p>

            <h3>STLはそのまま印刷できますか？</h3>
            <p>
                はい。モデルは平らで中央に配置された状態で、仮想プリントベッド上に書き出されます。
            </p>

            <h3>非常に薄いワッシャーを作成できますか？</h3>
            <p>
                小さい寸法を入力できますが、実用上の最小値はノズル、
                材料、レイヤー高さ、プリンターの調整状態によって異なります。
            </p>
        </section>
    </main>

    <div id="site-footer"></div>

    <script>
        const PAGE = {
            title: "ワッシャー・リングジェネレーター",
            heading: "ワッシャー・リングSTLジェネレーター",
            canonical: "https://vekmaker.com/ja/washer-ring-generator/",
            description: "外径、内径、厚さを指定して3Dプリント用のワッシャーやリングを作成し、STLをダウンロードできます。",
            keywords: "ワッシャー STL ジェネレーター, リング STL ジェネレーター, 3Dプリント, STL作成",
            generator: "washer-ring-generator"
        };
    </script>

    <script src="/assets/js/core/config.js"></script>
    <script src="/assets/js/core/layout.js"></script>
    <script src="/assets/js/core/page.js"></script>
    <script type="module" src="/assets/generators/washer-ring/washer-ring-generator.js"></script>
</body>
</html>
