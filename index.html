<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choose your language to use VEKMaker browser-based STL generators.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://vekmaker.com/">
    <link rel="alternate" hreflang="en" href="https://vekmaker.com/en/">
    <link rel="alternate" hreflang="pt" href="https://vekmaker.com/pt/">
    <link rel="alternate" hreflang="ja" href="https://vekmaker.com/ja/">
    <link rel="alternate" hreflang="x-default" href="https://vekmaker.com/">
    <link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
    <title>VEKMaker | Choose Language</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .language-entry{min-height:72vh;display:grid;place-items:center;padding:3rem 1rem}
        .language-entry-card{width:min(680px,100%);padding:2rem;border:1px solid #dbe3ec;border-radius:22px;background:#fff;box-shadow:0 18px 45px rgba(15,23,42,.10);text-align:center}
        .language-entry-card h1{margin-bottom:.65rem}
        .language-entry-card p{max-width:520px;margin:.4rem auto 1.5rem;color:#64748b;line-height:1.6}
        .language-entry-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
        .language-entry-buttons a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:84px;padding:1rem;border:2px solid #dbe3ec;border-radius:14px;background:#f8fafc;text-decoration:none;font-weight:800;color:#172033}
        .language-entry-buttons a:hover{border-color:#3b82f6;background:#eff6ff;color:#1d4ed8}
        .language-entry-buttons small{margin-top:.2rem;font-weight:600;color:#64748b}
        @media(max-width:600px){.language-entry-buttons{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <main class="language-entry">
        <section class="language-entry-card">
            <h1>VEKMaker</h1>
            <p>Choose your language / Escolha seu idioma / 言語を選択してください</p>
            <div class="language-entry-buttons">
                <a href="/en/" hreflang="en">English<small>EN</small></a>
                <a href="/pt/" hreflang="pt">Português<small>PT</small></a>
                <a href="/ja/" hreflang="ja">日本語<small>JA</small></a>
            </div>
        </section>
    </main>
</body>
</html>
