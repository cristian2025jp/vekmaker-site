<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse VEKMaker's browser-based STL generators and create customizable models for 3D printing without installing CAD software.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://vekmaker.com/en/generators/">
    <link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
    <title>Generators | VEKMaker</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div id="site-header"></div>
    <div id="site-menu"></div>

    <main class="container home-section">

        <div class="section-title">
            <h1>Online STL Generators</h1>
            <p>Choose a generator and start creating STL files.</p>
        </div>

        <section class="home-generators-section">
            <div class="section-heading-row">
                <div class="section-title">
                    <span class="section-eyebrow">Available now</span>
                    <h2>Available Generators</h2>
                    <p>Choose a tool, adjust the dimensions and download your STL file.</p>
                </div>
                <span class="generator-count" data-available-count></span>
            </div>

            <div
                class="generator-grid generator-grid-available"
                data-generator-grid="available"
            ></div>
        </section>

        <section class="home-section">
            <div class="section-title">
                <span class="section-eyebrow">In development</span>
                <h2>Coming Soon</h2>
                <p>More practical generators are planned for the VEKMaker collection.</p>
            </div>

            <div
                class="generator-grid generator-grid-soon"
                data-generator-grid="soon"
            ></div>
        </section>

    </main>

    <div id="site-footer"></div>

    <script>
        const PAGE = {
            title: "Generators",
            heading: "Online STL Generators",
            canonical: "https://vekmaker.com/en/generators/",
            description: "Browse VEKMaker's browser-based STL generators and create customizable models for 3D printing without installing CAD software.",
            keywords: "STL generators, 3D printing",
            generator: "generators"
        };
    </script>

    <script src="/assets/js/core/config.js"></script>
    <script src="/assets/js/core/layout.js"></script>
    <script src="/assets/js/core/page.js"></script>
    <script src="/assets/js/core/generators-data.js"></script>
    <script src="/assets/js/core/generator-cards.js"></script>
</body>
</html>
