<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create customizable STL files directly in your browser with VEKMaker. No installation or file upload required.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://vekmaker.com/en/">
    <link rel="alternate" hreflang="en" href="https://vekmaker.com/en/">
    <link rel="alternate" hreflang="pt" href="https://vekmaker.com/pt/">
    <link rel="alternate" hreflang="ja" href="https://vekmaker.com/ja/">
    <link rel="alternate" hreflang="x-default" href="https://vekmaker.com/">
    <link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
    <title>VEKMaker | Create STL Files Online</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
.language-switcher{display:flex;justify-content:flex-end;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.language-switcher a{display:inline-flex;align-items:center;justify-content:center;min-width:48px;padding:6px 10px;border:1px solid #d1d5db;border-radius:999px;background:#fff;color:#374151;font-size:13px;font-weight:700;text-decoration:none}
.language-switcher a:hover{border-color:#93c5fd;color:#2563eb}
.language-switcher a[aria-current="page"]{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}
</style>
</head>
<body>
    <div id="site-header"></div>
    <div id="site-menu"></div>

    <main>
        <section class="home-hero">
            <div class="container home-hero-inner">
                <nav class="language-switcher" aria-label="Language selection"><a href="/en/" hreflang="en" aria-current="page">EN</a><a href="/pt/" hreflang="pt">PT</a><a href="/ja/" hreflang="ja">日本語</a></nav>
                <span class="home-badge">Browser-based STL generators</span>
                <h1>Create STL files directly in your browser</h1>
                <p>Simple customizable models for 3D printing. No installation and no file upload required.</p>
                <a href="#available-generators" class="button primary-button">Browse Generators</a>
            </div>
        </section>

        <section class="container home-section home-generators-section" id="available-generators">
            <div class="section-heading-row">
                <div class="section-title">
                    <span class="section-eyebrow">Start creating</span>
                    <h2>Available Generators</h2>
                    <p>Choose a tool, adjust the dimensions and download your STL file.</p>
                </div>
                <span class="generator-count" data-available-count></span>
            </div>

            <div class="generator-grid generator-grid-available" data-generator-grid="available"></div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script>
        const PAGE = {
            title: "Create STL Files Online",
            heading: "Create STL Files Online",
            canonical: "https://vekmaker.com/en/",
            description: "Create customizable STL files directly in your browser with VEKMaker. No installation or file upload required.",
            keywords: "STL generator, 3D printing, browser STL generator, custom STL, VEKMaker",
            generator: "home"
        };
    </script>

    <script src="/assets/js/core/config.js"></script>
    <script src="/assets/js/core/layout.js"></script>
    <script src="/assets/js/core/page.js"></script>
    <script src="/assets/js/core/generators-data.js"></script>
    <script src="/assets/js/core/generator-cards.js"></script>
</body>
</html>
