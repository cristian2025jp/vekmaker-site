<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin / Token Generator | VEKMaker</title>
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        /*
         * Prevents the Three.js canvas from increasing the width of the
         * right-hand grid column during ResizeObserver updates.
         */
        .generator-preview {
            min-width: 0;
        }

        #token-preview {
            width: 100%;
            height: 420px;
            min-width: 0;
            overflow: hidden;
            border-radius: 12px;
            background: #f8f9fa;
        }

        #token-preview canvas {
            display: block;
            max-width: 100%;
        }

        @media (max-width: 700px) {
            #token-preview {
                height: 340px;
            }
        }
    </style>
</head>
<body>
    <div id="site-header"></div>
    <div id="site-menu"></div>

    <main class="container generator-page">
        <section class="generator-intro">
            <h2>Coin / Token Generator</h2>
            <p>
                Create a simple 3D printable coin or token with an optional
                center hole and export it as an STL file.
            </p>
        </section>

        <section class="generator-layout">
            <div class="generator-panel">
                <h3>Dimensions</h3>

                <label>
                    Diameter (mm)
                    <input
                        type="number"
                        id="token-diameter"
                        value="40"
                        min="5"
                        max="300"
                        step="0.1"
                    >
                </label>

                <label>
                    Thickness (mm)
                    <input
                        type="number"
                        id="token-thickness"
                        value="3"
                        min="0.5"
                        max="100"
                        step="0.1"
                    >
                </label>

                <label>
                    Segments
                    <input
                        type="number"
                        id="token-segments"
                        value="96"
                        min="12"
                        max="256"
                        step="1"
                    >
                </label>

                <label class="checkbox-label">
                    <input
                        type="checkbox"
                        id="token-center-hole"
                        checked
                    >
                    Center Hole
                </label>

                <label>
                    Hole Diameter (mm)
                    <input
                        type="number"
                        id="token-hole-diameter"
                        value="5"
                        min="1"
                        max="299"
                        step="0.1"
                    >
                </label>

                <p
                    id="token-validation-message"
                    class="validation-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button
                    id="generate-token"
                    class="button primary-button"
                >
                    Generate Token
                </button>

                <button
                    id="download-token"
                    class="btn-primary"
                >
                    Download Token STL
                </button>
            </div>

            <div class="generator-preview">
                <h3>Preview</h3>
                <div
                    id="token-preview"
                    class="preview-area"
                ></div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script>
        const PAGE = {
            title: "Coin / Token Generator",
            description: "Create custom 3D printable coins and tokens online with an optional center hole and export STL files directly from your browser.",
            keywords: "STL generator, coin generator, token generator, 3D printing, browser STL generator",
            generator: "coin-token-generator"
        };
    </script>

    <script src="/assets/js/core/config.js"></script>
    <script src="/assets/js/core/layout.js"></script>
    <script src="/assets/js/core/page.js"></script>
    <script
        type="module"
        src="/assets/generators/coin-token/coin-token-generator.js"
    ></script>
</body>
</html>
